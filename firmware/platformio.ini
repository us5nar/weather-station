; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:d1_mini]
platform = espressif8266
board = d1_mini
;board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
build_flags =
  -Ilib
  -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266WiFi/src
  -I${platformio.packages_dir}/framework-arduinoespressif8266/libraries/ESP8266HTTPClient/src
lib_extra_dirs =
  ${platformio.packages_dir}/framework-arduinoespressif8266/libraries
lib_deps =
  adafruit/Adafruit BME280 Library
  adafruit/Adafruit Unified Sensor
  bblanchon/ArduinoJson@^7.0.0
  plerup/EspSoftwareSerial@^8.2.0
  ESP8266WiFi
  ESP8266HTTPClient